4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z"},child:[]}]})(t)}function bl(t){return I({tag:"svg",attr:{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},child:[{tag:"path",attr:{d:"M5 12h14"},child:[]},{tag:"path",attr:{d:"m12 5 7 7-7 7"},child:[]}]})(t)}var wl={lencana:"Cetakan Pertama 2025 | Bahagian Profesionalisme Guru KPM",tajuk:"Kerangka Kurikulum Latihan (KKL) Pegawai Perkhidmatan Pendidikan",subtajuk:"Memperkasakan kompetensi PPP dalam menyampaikan perkhidmatan dengan lebih berkesan dan cemerlang ke arah mendepani cabaran ledakan ilmu serta kemahiran terkini seiring dengan dunia pendidikan yang dinamik.",visi:"Pendidikan Berkualiti, Insan Terdidik, Negara Sejahtera.",misi:"Melestarikan Sistem Pendidikan yang Berkualiti untuk Membangunkan Potensi Individu bagi Memenuhi Aspirasi Negara.",eisbn:"978-983-9425-34-5"},Cl={pengenalan:"Kementerian Pendidikan (KPM) sentiasa komited dalam memastikan Pegawai Perkhidmatan Pendidikan (PPP) melengkapkan diri dengan sikap, kemahiran dan pengetahuan yang bersesuaian dengan pembangunan profesionalisme berterusan (PPB) yang terancang. PPB dilaksanakan sebagai usaha untuk memastikan PPP kekal berkualiti dalam sistem pendidikan negara bagi melahirkan modal insan yang holistik selaras dengan Falsafah Pendidikan Kebangsaan. Kurikulum latihan merupakan tonggak pembangunan profesionalisme PPP ke arah pelaksanaan latihan yang bersifat relevan, dinamik dan berorientasikan ilmu serta kemahiran masa hadapan bagi melahirkan PPP yang kompeten seiring dengan cabaran abad ke-21.",tujuan:["Kerangka Kurikulum Latihan (KKL) PPP KPM merupakan rujukan dan panduan yang komprehensif kepada pembekal latihan dalam dan luar KPM sebagai usaha untuk mencapai kualiti dan piawaian yang ditetapkan bagi merancang dan melaksanakan latihan yang sistematik.","KKL PPP KPM memperincikan aspek pembangunan kompetensi dari segi generik dan fungsional bagi memastikan PPP memperoleh kemahiran yang menyeluruh dan relevan.","Struktur KKL PPP KPM yang dinamik merangkumi kandungan, penyampaian dan pentaksiran mampu menyediakan latihan yang menyeluruh dan berkesan bagi melahirkan PPP yang kompeten."],matlamat:"Memperkasakan kompetensi PPP dalam menyampaikan perkhidmatan dengan lebih berkesan dan cemerlang ke arah mendepani cabaran ledakan ilmu serta kemahiran terkini seiring dengan dunia pendidikan yang dinamik.",objektif:["Merancang latihan PPP yang mampan.","Membangunkan latihan yang dapat membentuk PPP berdaya saing dan kompeten.","Memastikan penyampaian latihan PPP berkualiti.","Melestarikan kualiti latihan PPP."],kesimpulan:["Kerangka Kurikulum Latihan Pegawai Perkhidmatan Pendidikan Kementerian Pendidikan merupakan wadah untuk memastikan kualiti penyampaian latihan lebih efisien dalam meningkatkan tahap profesionalisme PPP. KKL ini dapat menjadi pemangkin pembentukan PPP yang kompeten demi memenuhi hasrat KPM.","KPM berhasrat agar pembekal latihan dapat menjadikan KKL sebagai asas dan panduan dalam merancang dan melaksanakan latihan yang berkualiti selari dengan piawaian yang ditetapkan. Komitmen dan keprihatinan pembekal latihan mengguna pakai KKL dapat menyumbang ke arah penyampaian perkhidmatan awam yang lebih efektif."]},B0=[{nama:"Relevan",ikon:"target",huraian:"Kurikulum latihan seiring dengan tuntutan semasa berdasarkan matlamat dan keperluan organisasi."},{nama:"Dinamik",ikon:"atom",huraian:"Kurikulum latihan seiring dengan keperluan pendidikan global."},{nama:"Kontekstual",ikon:"compass",huraian:"Kurikulum latihan berfokuskan situasi kehidupan sebenar."},{nama:"Futuristik",ikon:"rocket",huraian:"Kurikulum latihan memenuhi kehendak masa hadapan."},{nama:"Komprehensif",ikon:"layers",huraian:"Pengetahuan, kemahiran dan sikap diintegrasikan dalam latihan secara holistik."}],lp="Reka bentuk Kerangka Kurikulum Latihan menggunakan dua bentuk geometri untuk menggambarkan konsep berbeza. Lingkaran penuh melambangkan struktur kurikulum yang lengkap dan berfungsi sebagai satu kitaran tersusun, manakala separa bulatan menunjukkan pembelajaran berterusan, penambahbaikan progresif dan pembangunan kompetensi sepanjang hayat. Visual ini menekankan hubungan antara asas kurikulum yang kukuh dengan perkembangan kompetensi individu secara berterusan.",Bl=[{id:"kandungan",nama:"Kandungan",huraian:"Kandungan merujuk topik yang akan disampaikan kepada PPP sepanjang latihan. Kandungan ini merangkumi aspek pengetahuan, kemahiran dan sikap. Kandungan latihan direka bentuk secara sistematik untuk mencapai objektif latihan yang ditetapkan dan relevan dengan keperluan PPP."},{id:"penyampaian",nama:"Penyampaian",huraian:"Penyampaian merujuk aktiviti pengajaran dan pembelajaran yang dilaksanakan melalui pelbagai kaedah penyampaian bagi memastikan pembelajaran memenuhi keperluan pembelajaran dewasa (adult learning). Penyampaian ini membolehkan tenaga pengajar mencipta persekitaran pembelajaran yang lebih relevan dan berkesan untuk meningkatkan kompetensi PPP."},{id:"pentaksiran",nama:"Pentaksiran",huraian:"Pentaksiran melibatkan proses mencerap kemajuan dan pencapaian PPP secara formatif atau sumatif melalui pelbagai kaedah pentaksiran untuk mencapai objektif latihan."}],Rn=[{id:"generik",nama:"Generik",butiran:["Latihan yang disediakan bagi melahirkan PPP yang lebih cekap dan berpengetahuan dalam melaksanakan tugas-tugas jawatan yang disandang.","Bidang latihan meliputi aspek pengetahuan, kemahiran dan ciri-ciri peribadi serta pembangunan jati diri PPP."]},{id:"fungsional",nama:"Fungsional",butiran:["Latihan yang disediakan kepada PPP bersesuaian dengan jawatan yang dipegang dan disandang dalam bahagian/jabatan.","Bidang latihan merangkumi latihan yang berkaitan dengan fungsi dan keperluan bahagian/jabatan."]}],se=[{id:"pkp",nama:"Pengurusan dan Kepimpinan Pendidikan",label:["PENGURUSAN DAN","KEPIMPINAN","PENDIDIKAN"],ikon:"briefcase",fokus:["Pengurusan dan Pengoperasian Institusi Pendidikan","Pengurusan Organisasi","Pengurusan Strate
